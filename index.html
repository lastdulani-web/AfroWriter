<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2a6b">
<title>AfroWriter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ef:Georgia,'Iowan Old Style',serif;--brand:#2b2a6b;--pop:#d93a73;--paper:#fcfcff;--ink:#1c1d33;--mute:#6a6d8c;--line:#dcdeee;--bg:#e9eaf4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--paper:#1a1c2e;--ink:#e9eaf5;--mute:#a0a4c4;--line:#2b2e48;--bg:#11121f}}
:root[data-theme=dark]{--paper:#1a1c2e;--ink:#e9eaf5;--mute:#a0a4c4;--line:#2b2e48;--bg:#11121f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
#theme,#focus,#docsbtn{background:none;border:1px solid #ffffff66;color:#fff;border-radius:6px;width:34px;height:28px;display:grid;place-items:center;padding:0}
#theme svg,#focus svg,#docsbtn svg{width:18px;height:18px}#focus[aria-pressed=true]{background:var(--pop);border-color:var(--pop)}#theme:focus-visible,#focus:focus-visible,#docsbtn:focus-visible{outline:2px solid var(--pop);outline-offset:1px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Iowan Old Style",serif;padding-top:env(safe-area-inset-top)}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;font-family:system-ui,sans-serif}
header .logo{flex:none;width:38px;height:38px;border-radius:10px;display:block;object-fit:contain;background:#fcfcff}
header b{font-size:16px;letter-spacing:.2px}
header b i{color:#ff9bbd;font-style:normal}
#status{margin-left:auto;font-size:12px;opacity:.85;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#newdoc{background:none;border:1px solid #ffffff66;color:#fff;border-radius:6px;padding:4px 10px;font:13px system-ui}
#bar{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:var(--paper);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif}
#bar button{flex:none;min-width:40px;height:38px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:15px}
#bar button:active,#bar button.on{background:var(--pop);color:#fff}
#bar button:focus-visible,#newdoc:focus-visible{outline:2px solid var(--pop);outline-offset:1px}
.sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
main{flex:1;overflow-y:auto;padding:14px 10px calc(14px + env(safe-area-inset-bottom))}
.page{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:100%;padding:22px 20px}
#title{width:100%;border:0;background:none;color:var(--ink);font-weight:700;font-size:26px;line-height:1.25;font-family:var(--ef);outline:none;padding:0 0 10px;border-bottom:3px solid var(--pop);margin-bottom:14px}
#ed{outline:none;min-height:50vh;word-wrap:break-word;font-family:var(--ef);font-size:var(--es,17px)}
#font,#styles,#size,#mode{flex:none;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:14px system-ui,sans-serif;padding:0 6px}
#ed:empty:before{content:attr(data-ph);color:var(--mute)}
#ed h1{font-size:1.4em;line-height:1.3;margin:1em 0 .3em}
#ed h2{font-size:1.18em;line-height:1.3;margin:1em 0 .3em}
#ed h3{font-size:1.06em;line-height:1.35;margin:.9em 0 .3em}
#ed h4{font-size:.95em;line-height:1.4;margin:.8em 0 .3em;font-style:italic}
#ed p,#ed div{margin:0 0 .7em}
#ed ul,#ed ol{padding-left:1.4em}
footer{font:12px system-ui,sans-serif;color:var(--mute);text-align:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){#status{transition:opacity .3s}}
body.focus #bar,body.focus footer{display:none}
.only-lyrics,.only-essay{display:none}
body[data-mode=lyrics] .only-lyrics,body[data-mode=essay] .only-essay{display:block}
body[data-mode=prose] #ed div,body[data-mode=prose] #ed p{text-indent:1.5em;margin:0;line-height:1.75}
body[data-mode=poem] #ed,body[data-mode=lyrics] #ed{white-space:pre-wrap;line-height:1.5}
body[data-mode=poem] #ed div,body[data-mode=poem] #ed p,body[data-mode=lyrics] #ed div,body[data-mode=lyrics] #ed p{margin:0}
body[data-mode=poem] .page{max-width:560px}
body[data-mode=essay] #ed div,body[data-mode=essay] #ed p{line-height:1.8;margin:0 0 .9em}
body.dbl[data-mode=essay] #ed div,body.dbl[data-mode=essay] #ed p{line-height:2.3}
#bar button[aria-pressed=true]{background:var(--pop);color:#fff}
#ed .sec{font-family:system-ui,sans-serif;font-weight:700;font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--pop);margin:1em 0 .2em;text-indent:0}
#docs{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 54px) 0 0 0;background:#0006;z-index:10;display:flex;justify-content:flex-end;align-items:flex-start}
#docs[hidden]{display:none}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:420px;max-height:calc(100% - 16px);margin:8px;display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 30px #0006;font-family:system-ui,sans-serif;overflow:hidden}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh b{flex:1;font-size:16px}
.dh button{border:0;border-radius:8px;height:34px;padding:0 12px;font-size:14px;background:var(--pop);color:#fff}
.dh #dclose{background:none;color:var(--ink);font-size:26px;padding:0 8px}
#dlist{overflow-y:auto;padding:6px}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px}
.row.cur{background:var(--bg)}
.row .info{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:4px;font:inherit}
.info .n{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .s{display:block;font-size:12px;color:var(--mute)}
.row .ib{flex:none;display:grid;place-items:center;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:36px;height:36px}
.empty{padding:20px;text-align:center;color:var(--mute);font-size:14px}
</style>
</head>
<body>
<header>
  <img src="logo-badge.png" alt="AfroWriter logo" class="logo" width="38" height="38">
  <b>Afro<i>Writer</i></b>
  <span id="status" aria-live="polite">Ready</span>
  <button id="theme" aria-label="Switch to dark mode" title="Dark / light mode"></button>
  <button id="focus" aria-label="Focus view" aria-pressed="false" title="Focus view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button id="docsbtn" aria-label="My documents" title="My documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button id="newdoc">New</button>
</header>
<div id="bar" role="toolbar" aria-label="Formatting">
  <button data-c="bold" aria-label="Bold"><b>B</b></button>
  <button data-c="italic" aria-label="Italic"><i>I</i></button>
  <button data-c="underline" aria-label="Underline"><u>U</u></button>
  <span class="sep"></span>
  <select id="mode" aria-label="Writing mode">
    <option value="prose">Prose</option>
    <option value="poem">Poem</option>
    <option value="lyrics">Lyrics</option>
    <option value="essay">Essay</option>
  </select>
  <button class="only-lyrics" data-l="Verse">Verse</button>
  <button class="only-lyrics" data-l="Chorus">Chorus</button>
  <button class="only-lyrics" data-l="Bridge">Bridge</button>
  <button class="only-essay" data-a="goal" aria-label="Set word goal">Goal</button>
  <button class="only-essay" data-a="dbl" id="dbl" aria-pressed="false" aria-label="Double spacing">2&times;</button>
  <span class="sep"></span>
  <select id="styles" aria-label="Styles">
    <option value="" selected disabled hidden>Styles</option>
    <option value="p">Normal text</option>
    <option value="h1">Heading 1</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
    <option value="h4">Heading 4</option>
  </select>
  <span class="sep"></span>
  <button data-c="insertUnorderedList" aria-label="Bulleted list">&bull; List</button>
  <button data-c="insertOrderedList" aria-label="Numbered list">1. List</button>
  <span class="sep"></span>
  <select id="font" aria-label="Font">
    <option value="Georgia,'Iowan Old Style',serif">Serif</option>
    <option value="'Times New Roman',Times,serif">Classic</option>
    <option value="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">Sans</option>
    <option value="'Courier New',Courier,monospace">Typewriter</option>
    <option value="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">Handwritten</option>
  </select>
  <select id="size" aria-label="Text size">
    <option value="12">12</option>
    <option value="13">13</option>
    <option value="14">14</option>
    <option value="15">15</option>
    <option value="16">16</option>
    <option value="17">17</option>
    <option value="18">18</option>
    <option value="20">20</option>
    <option value="22">22</option>
    <option value="24">24</option>
    <option value="26">26</option>
    <option value="28">28</option>
    <option value="32">32</option>
    <option value="36">36</option>
  </select>
  <span class="sep"></span>
  <button data-c="undo" aria-label="Undo">Undo</button>
  <button data-c="redo" aria-label="Redo">Redo</button>
</div>
<main>
  <div class="page">
    <input id="title" placeholder="Untitled" aria-label="Title" autocomplete="off">
    <div id="ed" contenteditable="true" data-ph="Start writing here. Everything saves on your device." spellcheck="true"></div>
  </div>
</main>
<footer id="count">0 words</footer>
<div id="docs" hidden>
  <div class="sheet" role="dialog" aria-label="Documents">
    <div class="dh"><b>My documents</b><button id="dnew">+ New piece</button><button id="dclose" aria-label="Close">&times;</button></div>
    <div id="dlist"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s), ed=$('#ed'), title=$('#title'), st=$('#status'), K='afrowriter:doc';
let t,mode='prose',goal=0;
function words(){const n=(ed.innerText.trim().match(/\S+/g)||[]).length;$('#count').textContent=(mode==='essay'&&goal)?n+' / '+goal+' words':n+(n===1?' word':' words')}
const LK='afrowriter:library',uid=()=>'d'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let lib={cur:null,docs:{}};
function snap(){return{t:title.value,h:ed.innerHTML,m:mode,g:goal}}
function save(){
  try{
    const s=snap(),o=lib.docs[lib.cur];
    if(o){const same=o.t===s.t&&o.h===s.h&&o.m===s.m&&o.g===s.g;lib.docs[lib.cur]=Object.assign({},o,s,{at:same?o.at:Date.now()})}
    localStorage.setItem(LK,JSON.stringify(lib));st.textContent='Saved'
  }catch(e){st.textContent='Could not save: storage full or blocked'}
}
function blank(m){return{t:'',h:'',m:m||'prose',g:0,at:Date.now()}}
function loadDoc(id){const d=lib.docs[id];lib.cur=id;title.value=d.t||'';ed.innerHTML=d.h||'';mode=d.m||'prose';goal=d.g||0}
function queue(){st.textContent='Saving...';words();clearTimeout(t);t=setTimeout(save,600)}
try{const l=JSON.parse(localStorage.getItem(LK)||'null');if(l&&l.docs)lib=l}catch(e){}
if(!lib.docs[lib.cur]){
  const ids=Object.keys(lib.docs);
  if(ids.length)lib.cur=ids.sort((a,b)=>lib.docs[b].at-lib.docs[a].at)[0];
  else{let d=null;try{d=JSON.parse(localStorage.getItem(K)||'null')}catch(e){}
    const id=uid();lib.docs[id]=d?Object.assign(blank(),d):blank();lib.cur=id}
}
loadDoc(lib.cur);
words();
ed.addEventListener('input',queue);title.addEventListener('input',queue);
ed.addEventListener('paste',e=>{e.preventDefault();document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text/plain'))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(t);save()}});
$('#bar').addEventListener('mousedown',e=>{if(e.target.tagName!=='SELECT')e.preventDefault()});
$('#bar').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){ed.focus();document.execCommand('insertHTML',false,'<div class="sec">'+b.dataset.l+'</div><div><br></div>');queue();return}
  if(b.dataset.a==='goal'){const v=prompt('Word goal (0 to clear)',goal||'500');if(v!==null){goal=Math.max(0,parseInt(v)||0);words();queue()}return}
  if(b.dataset.a==='dbl'){P.dbl=!P.dbl;apply();return}
  ed.focus();document.execCommand(b.dataset.c,false,b.dataset.v||null);queue();
});
function openDoc(id){clearTimeout(t);save();rng=null;loadDoc(id);setMode(mode,true);words();save();scrollTo(0,0);$('main').scrollTop=0}
function newPiece(){
  clearTimeout(t);save();
  const c=lib.docs[lib.cur];
  if(c&&!c.t&&!ed.innerText.trim()){closeDocs();return}
  const id=uid();lib.docs[id]=blank(mode);openDoc(id);closeDocs();title.focus()
}
$('#newdoc').onclick=newPiece;
const IC={pen:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',del:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wcount=x=>(x||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/g,' ').split(/\s+/).filter(Boolean).length;
function ago(ts){const m=Math.floor((Date.now()-ts)/6e4);if(m<1)return'just now';if(m<60)return m+' min ago';const h=Math.floor(m/60);if(h<24)return h+' h ago';const d=Math.floor(h/24);return d+(d===1?' day ago':' days ago')}
function renderDocs(){
  const items=Object.entries(lib.docs).sort((a,b)=>b[1].at-a[1].at);
  $('#dlist').innerHTML=items.map(([id,d])=>'<div class="row'+(id===lib.cur?' cur':'')+'" data-id="'+id+'"><button class="info" data-o="1"><span class="n">'+esc(d.t||'Untitled')+'</span><span class="s">'+d.m[0].toUpperCase()+d.m.slice(1)+' &middot; '+wcount(d.h)+' words &middot; '+ago(d.at)+'</span></button><button class="ib" data-r="1" aria-label="Rename">'+IC.pen+'</button><button class="ib" data-x="1" aria-label="Delete">'+IC.del+'</button></div>').join('')||'<div class="empty">No pieces yet</div>';
}
function openDocs(){clearTimeout(t);save();renderDocs();$('#docs').hidden=false}
function closeDocs(){$('#docs').hidden=true}
$('#docsbtn').onclick=openDocs;$('#dclose').onclick=closeDocs;$('#dnew').onclick=newPiece;
$('#docs').addEventListener('click',e=>{if(e.target.id==='docs')closeDocs()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDocs()});
$('#dlist').addEventListener('click',e=>{
  const row=e.target.closest('.row');if(!row)return;const id=row.dataset.id,d=lib.docs[id];
  if(e.target.closest('[data-r]')){const v=prompt('Rename this piece',d.t||'');if(v!==null){d.t=v.trim();if(id===lib.cur)title.value=d.t;save();renderDocs()}return}
  if(e.target.closest('[data-x]')){
    if(!confirm('Delete "'+(d.t||'Untitled')+'" from this device? This cannot be undone.'))return;
    delete lib.docs[id];
    if(id===lib.cur){const ids=Object.keys(lib.docs).sort((a,b)=>lib.docs[b].at-lib.docs[a].at);const nid=ids[0]||uid();if(!ids.length)lib.docs[nid]=blank(mode);openDoc(nid)}
    else save();
    renderDocs();return
  }
  openDoc(id);closeDocs();
});
let rng=null;
document.addEventListener('selectionchange',()=>{const s=getSelection();if(s.rangeCount&&ed.contains(s.anchorNode))rng=s.getRangeAt(0).cloneRange()});
$('#styles').addEventListener('change',e=>{
  const sel=e.target;ed.focus();
  if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}
  document.execCommand('formatBlock',false,sel.value);sel.selectedIndex=0;queue();
});
const PK='afrowriter:prefs',fs=$('#font');
let P={f:fs.value,s:17};
try{P=Object.assign(P,JSON.parse(localStorage.getItem(PK)||'{}'))}catch(e){}
function apply(){
  const r=document.documentElement.style;r.setProperty('--ef',P.f);r.setProperty('--es',P.s+'px');
  if([...fs.options].some(o=>o.value===P.f))fs.value=P.f;
  if(P.theme)document.documentElement.dataset.theme=P.theme;
  document.body.classList.toggle('dbl',!!P.dbl);const db=$('#dbl');if(db)db.setAttribute('aria-pressed',!!P.dbl);
  if(typeof paintTheme==='function')paintTheme();
  const sz=$('#size');
  if(![...sz.options].some(o=>+o.value===P.s)){const o=new Option(P.s,P.s);const nx=[...sz.options].find(x=>+x.value>P.s);sz.add(o,nx||null)}
  sz.value=P.s;
  try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}
}
$('#size').addEventListener('change',e=>{P.s=+e.target.value;apply()});
const ICON={sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'},tb=$('#theme'),mq=matchMedia('(prefers-color-scheme:dark)');
function isDark(){const t=document.documentElement.dataset.theme;return t?t==='dark':mq.matches}
function paintTheme(){const d=isDark();tb.innerHTML=d?ICON.sun:ICON.moon;tb.setAttribute('aria-label',d?'Switch to light mode':'Switch to dark mode')}
tb.addEventListener('click',()=>{P.theme=isDark()?'light':'dark';apply()});
fs.addEventListener('change',()=>{P.f=fs.value;apply()});
apply();
function setMode(m,init){mode=m;document.body.dataset.mode=m;$('#mode').value=m;words();if(!init)queue()}
$('#mode').addEventListener('change',e=>setMode(e.target.value));
$('#focus').addEventListener('click',e=>{const on=document.body.classList.toggle('focus');e.currentTarget.setAttribute('aria-pressed',on)});
setMode(mode,true);
mq.addEventListener&&mq.addEventListener('change',paintTheme);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
