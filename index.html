<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="author" content="Last Dulani">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2a6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AfroWriter">
<title>AfroWriter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--ef:Georgia,'Iowan Old Style',serif;--brand:#2b2a6b;--pop:#d93a73;--paper:#fcfcff;--ink:#1c1d33;--mute:#6a6d8c;--line:#dcdeee;--bg:#e9eaf4}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--paper:#1a1c2e;--ink:#e9eaf5;--mute:#a0a4c4;--line:#2b2e48;--bg:#11121f}}
:root[data-theme=dark]{--paper:#1a1c2e;--ink:#e9eaf5;--mute:#a0a4c4;--line:#2b2e48;--bg:#11121f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
#theme,#focus,#docsbtn{background:none;border:1px solid #ffffff66;color:#fff;border-radius:6px;width:32px;height:28px;display:grid;place-items:center;padding:0}
#theme svg,#focus svg,#docsbtn svg{width:18px;height:18px}#focus[aria-pressed=true]{background:var(--pop);border-color:var(--pop)}#theme:focus-visible,#focus:focus-visible,#docsbtn:focus-visible{outline:2px solid var(--pop);outline-offset:1px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:17px/1.65 Georgia,"Iowan Old Style",serif}
header{background:var(--brand);color:#fff;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;font-family:system-ui,sans-serif}
header .logo{flex:none;width:38px;height:38px;border-radius:10px;display:block;object-fit:contain;background:#fcfcff}
header b{font-size:16px;letter-spacing:.2px}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:none}
.brand small{font-size:10px;color:#fff;font-weight:400;letter-spacing:.2px;white-space:nowrap}
@media(max-width:400px){#status{display:none}}
header b i{color:#ff9bbd;font-style:normal}
#status{margin-left:auto;font-size:12px;opacity:.85;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#newdoc{background:none;border:1px solid #ffffff66;color:#fff;border-radius:6px;padding:4px 10px;font:13px system-ui}
#bar{display:flex;gap:4px;overflow-x:auto;padding:6px 8px;background:var(--paper);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif}
#bar button{flex:none;min-width:40px;height:38px;border:0;border-radius:8px;background:none;color:var(--ink);font-size:15px}
#bar button:active,#bar button.on{background:var(--pop);color:#fff}
#bar button:focus-visible,#newdoc:focus-visible{outline:2px solid var(--pop);outline-offset:1px}
.sep{flex:none;width:1px;background:var(--line);margin:4px 4px}
main{flex:1;overflow-y:auto;padding:14px 10px calc(14px + env(safe-area-inset-bottom))}
.page{max-width:720px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:4px;min-height:100%;padding:22px 20px}
#title{width:100%;border:0;background:none;color:var(--ink);font-weight:700;font-size:26px;line-height:1.25;font-family:var(--ef);outline:none;padding:0 0 10px;border-bottom:3px solid var(--pop);margin-bottom:14px}
#ed{outline:none;min-height:50vh;word-wrap:break-word;font-family:var(--ef);font-size:var(--es,17px)}
#font,#styles,#size,#mode,#exp,#list,#case,#sec,#mood{flex:none;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:14px system-ui,sans-serif;padding:0 6px}
#ed:empty:before{content:attr(data-ph);color:var(--mute)}
#ed h1{font-size:1.4em;line-height:1.3;margin:1em 0 .3em}
#ed h2{font-size:1.18em;line-height:1.3;margin:1em 0 .3em}
#ed h3{font-size:1.06em;line-height:1.35;margin:.9em 0 .3em}
#ed h4{font-size:.95em;line-height:1.4;margin:.8em 0 .3em;font-style:italic}
#ed p,#ed div{margin:0 0 .7em}
#ed ul,#ed ol{padding-left:1.4em}
footer{font:12px system-ui,sans-serif;color:var(--mute);text-align:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:no-preference){#status{transition:opacity .3s}}
body.focus #bar,body.focus footer,body.focus #tabs{display:none}
.only-lyrics,.only-essay{display:none}
body[data-mode=lyrics] .only-lyrics,body[data-mode=essay] .only-essay{display:block}
body[data-mode=prose] #ed div,body[data-mode=prose] #ed p{text-indent:1.5em;margin:0;line-height:1.75}
body[data-mode=poem] #ed,body[data-mode=lyrics] #ed{white-space:pre-wrap;line-height:1.5}
body[data-mode=poem] #ed div,body[data-mode=poem] #ed p,body[data-mode=lyrics] #ed div,body[data-mode=lyrics] #ed p{margin:0}
body[data-mode=poem] .page{max-width:560px}
body[data-mode=essay] #ed div,body[data-mode=essay] #ed p{line-height:1.8;margin:0 0 .9em}
body.dbl[data-mode=essay] #ed div,body.dbl[data-mode=essay] #ed p{line-height:2.3}
#bar button[aria-pressed=true]{background:var(--pop);color:#fff}
#ed .sec{font-family:system-ui,sans-serif;font-weight:700;font-size:.78em;letter-spacing:.1em;text-transform:uppercase;color:var(--pop);margin:1em 0 .2em;text-indent:0}
#docs,#side{position:fixed;inset:calc(env(safe-area-inset-top,0px) + 54px) 0 0 0;background:#0006;z-index:10;display:flex;justify-content:flex-end;align-items:flex-start}
#docs[hidden],#side[hidden]{display:none}
.sheet{background:var(--paper);color:var(--ink);width:100%;max-width:420px;max-height:calc(100% - 16px);margin:8px;display:flex;flex-direction:column;border-radius:14px;border:1px solid var(--line);box-shadow:0 10px 30px #0006;font-family:system-ui,sans-serif;overflow:hidden}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.dh b{flex:1;font-size:16px}
.dh button{border:0;border-radius:8px;height:34px;padding:0 12px;font-size:14px;background:var(--pop);color:#fff}
.dh #dclose,.dh #sideclose{background:none;color:var(--ink);font-size:26px;padding:0 8px}
#dlist{overflow-y:auto;padding:6px}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:10px}
.row.cur{background:var(--bg)}
.row .info{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--ink);padding:4px;font:inherit}
.info .n{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info .s{display:block;font-size:12px;color:var(--mute)}
.row .ib{flex:none;display:grid;place-items:center;border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;width:36px;height:36px}
.empty{padding:20px;text-align:center;color:var(--mute);font-size:14px}
#tabs{display:flex;align-items:stretch;gap:4px;overflow-x:auto;padding:6px 8px 0;background:var(--bg);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;max-width:180px;border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0}
.tab.on{background:var(--paper);border-color:var(--line);margin-bottom:-1px}
.tab .tl{border:0;background:none;color:var(--mute);font:13px system-ui,sans-serif;padding:8px 4px 8px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.tab.on .tl{color:var(--ink);font-weight:600}
.tab .tx{border:0;background:none;color:var(--mute);font-size:17px;line-height:1;padding:6px 9px}
.tab:only-of-type .tx{display:none}
.tab:only-of-type .tl{padding-right:10px}
#tplus{flex:none;border:0;background:none;color:var(--ink);font-size:20px;padding:0 12px}
footer{display:flex;justify-content:center;align-items:center;gap:10px}
#state{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:2px 11px;font:12px system-ui,sans-serif}
#state.fin{background:var(--pop);border-color:var(--pop);color:#fff}
.flt{display:flex;gap:6px;padding:8px 14px 2px}
.flt button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
.flt button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#splash{position:fixed;inset:0;z-index:20;background:var(--brand);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-family:system-ui,sans-serif;transition:opacity .4s}
#splash img{border-radius:22px}
#splash b{font-size:26px;letter-spacing:.2px}
#splash i{color:#ff9bbd;font-style:normal}
#splash span{font-size:14px;opacity:.85}
#splash.out{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){#splash{transition:none}}
.credit{padding:10px 14px;font-size:12px;color:var(--mute);text-align:center;border-top:1px solid var(--line)}
.lab{flex:none;display:flex;align-items:center;gap:2px;height:38px;border:1px solid var(--line);border-radius:8px;padding-left:9px;background:var(--paper);font:700 11px system-ui,sans-serif;letter-spacing:.08em;color:var(--mute)}
.lab #mode{border:0;background:var(--paper);height:100%;font-weight:600}
select option{background:var(--paper);color:var(--ink)}
#bar svg{display:block}
#picker{position:fixed;inset:0;z-index:15;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,sans-serif}
#picker[hidden]{display:none}
.pk{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:440px;padding:16px;max-height:100%;overflow-y:auto}
.pkh{display:flex;align-items:center;margin-bottom:12px}
.pkh b{flex:1;font-size:18px}
.pkh button{border:0;background:none;color:var(--ink);font-size:28px;line-height:1;padding:0 6px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;justify-content:flex-start;align-items:flex-start;text-align:left;border:1px solid var(--line);border-top:3px solid var(--pop);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;min-height:116px;font:inherit}
.card b{display:block;font-size:16px;margin-bottom:6px}
.card span{display:block;font-size:12.5px;line-height:1.4;color:var(--mute)}
.card:active{border-color:var(--pop)}
[data-for]{display:none}
body[data-mode=prose] [data-for~=prose],body[data-mode=poem] [data-for~=poem],body[data-mode=lyrics] [data-for~=lyrics],body[data-mode=essay] [data-for~=essay],body[data-mode=journal] [data-for~=journal]{display:block}
#saved{display:flex;align-items:center;gap:5px}
#dot{width:7px;height:7px;border-radius:50%;background:#3fb68b;display:inline-block}
#dot.busy{background:var(--pop)}#dot.bad{background:#d33}
footer{flex-wrap:wrap;row-gap:2px}
.card.wide{grid-column:1/-1;min-height:0}
#findbar{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px;background:var(--paper);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif}
#findbar[hidden]{display:none}
#findbar input{flex:1 1 120px;min-width:0;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 8px;font-size:14px}
#findbar button{height:34px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--ink);padding:0 10px;font-size:13px}
body.focus #findbar{display:none}
#thesis{margin:0 0 14px;border:1px dashed var(--line);border-radius:8px;padding:6px 10px;font-family:system-ui,sans-serif}
#thesis summary{cursor:pointer;font-size:13px;color:var(--mute);font-weight:600}
#thesisbox{width:100%;margin-top:6px;border:0;background:none;color:var(--ink);font:15px/1.5 Georgia,serif;resize:vertical;outline:none}
body[data-mode=prose] .page{padding-left:clamp(20px,6vw,56px)}
#ed .sb{text-align:center;text-indent:0;color:var(--mute);letter-spacing:.4em;margin:1em 0}
#ed .jd{font-family:system-ui,sans-serif;font-weight:700;color:var(--ink);border-left:4px solid var(--pop);padding-left:8px;margin:1.2em 0 .4em;text-indent:0}
body.pc[data-mode=poem] #ed{text-align:center}
#ed .ref{padding-left:2em;text-indent:-2em;margin:0 0 .5em}
#sidebody{overflow-y:auto;padding:8px 12px 12px;font-family:system-ui,sans-serif;font-size:14px}
.sl{display:flex;gap:10px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.sl b{min-width:28px;text-align:right;color:var(--pop)}
.sl span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh{margin:10px 0 2px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.seg{display:flex;gap:6px;margin-bottom:8px}
.seg button,.rb{border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rb{border-radius:8px;background:var(--pop);border-color:var(--pop);color:#fff;height:36px;margin-top:4px}
.rb.ghost{background:none;color:var(--ink);border-color:var(--line);width:100%}
.rf input,.rf select{width:100%;height:36px;margin:3px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:0 8px;font-size:14px}
.rr{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.rr span{flex:1;min-width:0}
.rr button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;height:30px;padding:0 10px}
.tocr{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 4px;border-bottom:1px solid var(--line);font:inherit}
.tocr.l2{padding-left:18px}.tocr.l3{padding-left:32px}.tocr.l4{padding-left:46px}
.tocr.l1{font-weight:700}
@media(max-width:600px){
#tabs:has(.tab:only-of-type){display:none}
main{padding:0 0 calc(10px + env(safe-area-inset-bottom))}
.page{border:0;border-radius:0;padding:16px 14px}
#title{font-size:22px;padding-bottom:8px;margin-bottom:10px}
#bar{flex-wrap:wrap;overflow:visible;padding:4px 6px;gap:2px 4px}
#bar .sep{display:none}
#bar button{height:34px;min-width:34px;padding:0 8px}
#font,#styles,#size,#mode,#exp,#list,#case,#sec,#mood{height:34px;font-size:13px;padding:0 2px 0 5px}
#sec{width:84px}#mood{width:72px}#mode{width:78px}#styles{width:80px}#list{width:58px}#font{width:90px}#size{width:50px}#case{width:52px}#exp{width:70px}
.lab{height:34px}
#bar button{min-width:36px}
#bar button{padding:0 6px;min-width:32px}
#bar .lbl{display:none}
}
@media(max-width:380px){.brand small{font-size:9px}}
#editrow{display:none}
@media(max-width:600px){
#editrow{display:flex;padding:4px 8px;background:var(--paper);border-bottom:1px solid var(--line);font-family:system-ui,sans-serif}
#editbtn{display:flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink);font-size:13px}
#editbtn .chev{transition:transform .25s}
#editbtn[aria-expanded=true]{background:var(--pop);border-color:var(--pop);color:#fff}
#editbtn[aria-expanded=true] .chev{transform:rotate(180deg)}
#bar{max-height:0;overflow:hidden;padding-top:0;padding-bottom:0;border-bottom:0;transition:max-height .25s ease}
body.tb-open #bar{max-height:260px;overflow:visible;padding-top:4px;padding-bottom:4px;border-bottom:1px solid var(--line)}
body.focus #editrow{display:none}
}
@media(prefers-reduced-motion:reduce){#bar,#editbtn .chev{transition:none}}
@media print{
#editrow,#picker,#thesis,#findbar,#side{display:none!important}
#splash{display:none!important}
:root,:root:not([data-theme=light]),:root[data-theme=dark],:root[data-theme=light]{--paper:#fff;--ink:#000;--mute:#444;--line:#bbb;--bg:#fff;--pop:#444}
header,#bar,#tabs,footer,#docs{display:none!important}
html,body{height:auto;background:#fff;color:#000;padding:0}
body{display:block}
main{overflow:visible;padding:0}
.page{border:0;max-width:none;padding:0;min-height:0;background:#fff}
#title{border-bottom:1px solid #999}
#ed{min-height:0}
#ed .sec{color:#000}
@page{margin:2cm}
}
</style>
</head>
<body>
<header>
  <img src="logo-badge.png" alt="AfroWriter logo" class="logo" width="38" height="38">
  <div class="brand"><b>Afro<i>Writer</i></b><small>Developed by Last Dulani</small></div>
  <span id="status" aria-live="polite">Ready</span>
  <button id="theme" aria-label="Switch to dark mode" title="Dark / light mode"></button>
  <button id="focus" aria-label="Focus view" aria-pressed="false" title="Focus view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  <button id="docsbtn" aria-label="My documents" title="My documents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
  <button id="newdoc">New</button>
</header>
<div id="tabs" role="tablist" aria-label="Open pieces"></div>
<div id="editrow"><button id="editbtn" aria-label="Format" aria-expanded="false" aria-controls="bar"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>Format</span><svg class="chev" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></div>
<div id="bar" role="toolbar" aria-label="Formatting">
  <label class="lab"><span>MODE</span><select id="mode" aria-label="Writing mode">
    <option value="prose">Prose</option>
    <option value="poem">Poem</option>
    <option value="lyrics">Lyrics</option>
    <option value="essay">Essay</option>
    <option value="journal">Journal</option>
  </select></label>
  <button data-for="prose" data-a="auto" id="auto" aria-pressed="true" aria-label="Auto-correct">Auto</button>
  <button data-for="prose" data-ins="sb" aria-label="Scene break">* * *</button>
  <button data-for="prose essay" data-a="toc">Contents</button>
  <button data-for="poem" data-a="center" id="ctr" aria-pressed="false">Center</button>
  <button data-for="poem lyrics" data-a="syl">Syllables</button>
  <select data-for="lyrics" id="sec" aria-label="Insert section"><option value="" selected disabled hidden>Section</option><option>Verse</option><option>Pre-Chorus</option><option>Chorus</option><option>Bridge</option><option>Hook</option><option>Outro</option><option>Instrumental Break</option></select>
  <button data-for="essay" data-a="goal" aria-label="Set word goal">Goal</button>
  <button data-for="essay" data-a="dbl" id="dbl" aria-pressed="false" aria-label="Double spacing">2&times;</button>
  <button data-for="essay" data-a="refs">References</button>
  <button data-for="journal" data-a="today">Today</button>
  <select data-for="journal" id="mood" aria-label="Mood"><option value="" selected disabled hidden>Mood</option><option value="&#128522;">&#128522; Happy</option><option value="&#128578;">&#128578; Good</option><option value="&#128528;">&#128528; Okay</option><option value="&#128577;">&#128577; Low</option><option value="&#128546;">&#128546; Sad</option></select>
  <button data-for="journal" data-a="entries">Entries</button>
  <span class="sep"></span>
  <select id="styles" aria-label="Styles">
    <option value="" selected disabled hidden>Styles</option>
    <option value="p">Normal text</option>
    <option value="h1">Heading 1</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
    <option value="h4">Heading 4</option>
  </select>
  <select id="list" aria-label="List">
    <option value="" selected disabled hidden>List</option>
    <option value="insertUnorderedList">Bulleted list</option>
    <option value="insertOrderedList">Numbered list</option>
  </select>
  <span class="sep"></span>
  <button data-c="bold" aria-label="Bold"><b>B</b></button>

const enc=new TextEncoder();
const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zip(files){
  const now=new Date(),dt=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate(),tm=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1);

  for(const f of files){
    const nm=enc.encode(f.name),d=enc.encode(f.data),c=crc(d);

    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);lh.setUint32(14,c,true);lh.setUint32(18,d.length,true);lh.setUint32(22,d.length,true);lh.setUint16(26,nm.length,true);

    cd.push(new Uint8Array(ch.buffer),nm);

  }
  let cds=0;cd.forEach(p=>cds+=p.length);

const XE=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function wrun(text,f){
  const rp=(f.b?'<w:b/>':'')+(f.i?'<w:i/>':'')+(f.caps?'<w:caps/>':'')+(f.color?'<w:color w:val="'+f.color+'"/>':'')+(f.sz?'<w:sz w:val="'+f.sz+'"/>':'')+(f.u?'<w:u w:val="single"/>':'');
  return '<w:r>'+(rp?'<w:rPr>'+rp+'</w:rPr>':'')+'<w:t xml:space="preserve">'+XE(text)+'</w:t></w:r>';
}
function wruns(node,fmt,out){
  node.childNodes.forEach(n=>{
    if(n.nodeType===3){if(n.nodeValue)out.push(wrun(n.nodeValue,fmt))}
    else if(n.nodeType===1){
      const tg=n.tagName;
      if(tg==='BR'){out.push('<w:r><w:br/></w:r>');return}
      const f=Object.assign({},fmt);
      if(tg==='B'||tg==='STRONG')f.b=1;
      if(tg==='I'||tg==='EM')f.i=1;
      if(tg==='U')f.u=1;
      wruns(n,f,out)
    }
  })
}
const wpara=(inner,pp)=>'<w:p>'+(pp?'<w:pPr>'+pp+'</w:pPr>':'')+inner+'</w:p>';
function wblock(n,f,out){if(n.childNodes.length===1&&n.childNodes[0].tagName==='BR')return;wruns(n,f,out)}
function buildDocx(root,ttl,md,dbl,fam){
  const sp=md==='essay'?(dbl?'<w:spacing w:after="0" w:line="480" w:lineRule="auto"/>':'<w:spacing w:after="160" w:line="360" w:lineRule="auto"/>'):md==='prose'?'<w:spacing w:after="0" w:line="360" w:lineRule="auto"/><w:ind w:firstLine="360"/>':'<w:spacing w:after="0" w:line="276" w:lineRule="auto"/>';
  const out=[];let cur=[];
  if(ttl)out.push(wpara(wrun(ttl,{b:1,sz:44}),'<w:spacing w:after="280"/>'));
  const flush=()=>{if(cur.length){out.push(wpara(cur.join(''),sp));cur=[]}};
  root.childNodes.forEach(n=>{
    const blockTag=n.nodeType===1&&/^(DIV|P|H[1-4]|UL|OL)$/.test(n.tagName);
    if(!blockTag){wruns({childNodes:[n]},{},cur);return}
    flush();
    const tg=n.tagName,r=[];
    if(/^H[1-4]$/.test(tg)){wblock(n,{b:1,i:tg==='H4'?1:0,sz:{H1:36,H2:30,H3:26,H4:24}[tg]},r);out.push(wpara(r.join(''),'<w:keepNext/><w:spacing w:before="240" w:after="80"/>'));return}
    if(tg==='UL'||tg==='OL'){let k=0;n.childNodes.forEach(li=>{if(li.tagName!=='LI')return;k++;const r2=[];wruns(li,{},r2);out.push(wpara(wrun(tg==='UL'?'\u2022\t':k+'.\t',{})+r2.join(''),'<w:tabs><w:tab w:val="left" w:pos="540"/></w:tabs><w:spacing w:after="40"/><w:ind w:left="540" w:hanging="360"/>'))});return}
    if(n.classList&&n.classList.contains('jd')){wblock(n,{b:1,sz:26},r);out.push(wpara(r.join(''),'<w:keepNext/><w:spacing w:before="280" w:after="80"/>'));return}
    if(n.classList&&n.classList.contains('sb')){out.push(wpara(wrun('* * *',{}),'<w:spacing w:before="200" w:after="200"/><w:jc w:val="center"/>'));return}
    if(n.classList&&n.classList.contains('ref')){wblock(n,{},r);out.push(wpara(r.join(''),'<w:spacing w:after="80"/><w:ind w:left="720" w:hanging="720"/>'));return}
    if(n.classList&&n.classList.contains('sec')){wblock(n,{b:1,caps:1,color:'D93A73',sz:20},r);out.push(wpara(r.join(''),'<w:keepNext/><w:spacing w:before="240" w:after="60"/>'));return}
    wblock(n,{},r);out.push(wpara(r.join(''),sp))
  });
  flush();
  const W='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"',H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zip([
    {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>'},
    {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'},
    {name:'word/_rels/document.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:'word/styles.xml',data:H+'<w:styles '+W+'><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="'+XE(fam)+'" w:hAnsi="'+XE(fam)+'" w:cs="'+XE(fam)+'"/><w:sz w:val="24"/><w:szCs w:val="24"/></w:rPr></w:rPrDefault></w:docDefaults></w:styles>'},
    {name:'word/document.xml',data:H+'<w:document '+W+'><w:body>'+out.join('')+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>'}
  ]);
}

function slug(){return(title.value.trim()||'AfroWriter').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-').slice(0,60)||'AfroWriter'}
function doDocx(){
  clearTimeout(t);save();
  const first=P.f.split(',')[0].replace(/['"]/g,'').trim();
  const blob=buildDocx(ed,title.value.trim(),mode,!!P.dbl,/system-ui/.test(first)?'Calibri':first);
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=slug()+'.docx';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  st.textContent='Word file ready'
}
function doPdf(){
  clearTimeout(t);save();const old=document.title;document.title=title.value.trim()||'AfroWriter';
  const back=()=>{document.title=old;removeEventListener('afterprint',back)};
  addEventListener('afterprint',back);setTimeout(()=>{print();setTimeout(back,3000)},50)
}
$('#exp').addEventListener('change',e=>{const v=e.target.value;e.target.selectedIndex=0;v==='pdf'?doPdf():doDocx()});
const sp=$('#splash');
function hideSplash(){sp.classList.add('out');setTimeout(()=>sp.remove(),500)}
try{if(sessionStorage.getItem('afrowriter:splash'))sp.remove();else{sessionStorage.setItem('afrowriter:splash','1');setTimeout(hideSplash,1600);sp.onclick=hideSplash}}catch(e){setTimeout(hideSplash,1600)}
$('#picker').addEventListener('click',e=>{
  if(e.target.id==='picker'||e.target.closest('#pkclose')){$('#picker').hidden=true;return}
  const c=e.target.closest('.card');if(c)makePiece(c.dataset.m);
});
function restoreSel(){ed.focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}}
$('#list').addEventListener('change',e=>{const s=e.target;restoreSel();document.execCommand(s.value,false,null);s.selectedIndex=0;queue()});
$('#case').addEventListener('change',e=>{const s=e.target,kind=s.value;s.selectedIndex=0;restoreSel();
  const sel=getSelection();
  if(!sel.rangeCount||sel.isCollapsed||!ed.contains(sel.anchorNode)){st.textContent='Select some text first';return}
  const r=sel.getRangeAt(0).cloneRange(),cn=r.commonAncestorContainer,root=cn.nodeType===3?cn.parentNode:cn;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),segs=[];
  for(let n=w.nextNode();n;n=w.nextNode()){
    if(!r.intersectsNode(n))continue;
    const a=n===r.startContainer?r.startOffset:0,b=n===r.endContainer?r.endOffset:n.nodeValue.length;
    if(b>a)segs.push([n,a,b]);
  }
  const cap=x=>x.replace(/(^|[\s(\[\u201C"\-])(\p{L})/gu,(m,p,c)=>p+c.toUpperCase());
  for(let k=segs.length-1;k>=0;k--){
    const [n,a,b]=segs[k],full=n.nodeValue,old=full.slice(a,b);
    const nw=kind==='up'?old.toUpperCase():kind==='lo'?old.toLowerCase():cap(full).slice(a,b);
    if(nw===old)continue;
    const rr=document.createRange();rr.setStart(n,a);rr.setEnd(n,b);sel.removeAllRanges();sel.addRange(rr);
    document.execCommand('insertText',false,nw);
  }
  queue();
});
const ebtn=$('#editbtn');
function setBar(o){document.body.classList.toggle('tb-open',o);ebtn.setAttribute('aria-expanded',o)}
ebtn.addEventListener('mousedown',e=>e.preventDefault());
ebtn.onclick=()=>setBar(!document.body.classList.contains('tb-open'));
const TYPING=new Set(['insertText','insertCompositionText','insertLineBreak','insertParagraph','insertFromPaste','deleteContentBackward','deleteContentForward','deleteWordBackward']);
ed.addEventListener('beforeinput',e=>{if(TYPING.has(e.inputType)&&document.body.classList.contains('tb-open'))setBar(false)});
title.addEventListener('input',()=>{if(document.body.classList.contains('tb-open'))setBar(false)});

/* ---------- Journal ---------- */
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function insertToday(){
  const d=new Date(),k=iso(d),ex=[...ed.querySelectorAll('.jd')].find(x=>x.dataset.d===k);
  if(ex){ex.scrollIntoView({block:'center'});return ex}
  const el=document.createElement('div');el.className='jd';el.dataset.d=k;
  el.textContent=d.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const nx=document.createElement('div');nx.innerHTML='<br>';ed.append(el,nx);
  const r=document.createRange();r.setStart(nx,0);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);
  nx.scrollIntoView({block:'center'});queue();return el
}
$('#mood').addEventListener('change',e=>{const s=e.target,v=s.value;s.selectedIndex=0;restoreSel();
  let n=getSelection().anchorNode;while(n&&n.parentNode!==ed)n=n.parentNode;
  let jd=null;for(let x=n;x;x=x.previousSibling){if(x.classList&&x.classList.contains('jd')){jd=x;break}}
  if(!jd)jd=insertToday();
  jd.querySelectorAll('.mood').forEach(m=>m.remove());
  const m=document.createElement('span');m.className='mood';m.textContent=' '+v;jd.append(m);queue()});
$('#sec').addEventListener('change',e=>{const s=e.target,v=s.value;s.selectedIndex=0;restoreSel();
  document.execCommand('insertHTML',false,'<div class="sec">'+esc(v)+'</div><div><br></div>');queue()});
$('#thesisbox').addEventListener('input',queue);

/* ---------- Typing helpers: auto-correct, and clean new lines after labels ---------- */
function blockOf(r){let n=r.startContainer;if(n===ed)return null;while(n&&n.parentNode!==ed)n=n.parentNode;return n}
ed.addEventListener('beforeinput',e=>{
  const sel=getSelection();if(!sel.rangeCount||!sel.isCollapsed)return;
  const r=sel.getRangeAt(0),b=blockOf(r);
  if(e.inputType==='insertParagraph'&&b&&b.classList&&(b.classList.contains('jd')||b.classList.contains('sec')||b.classList.contains('sb'))){
    e.preventDefault();const nx=document.createElement('div');nx.innerHTML='<br>';b.after(nx);
    const rr=document.createRange();rr.setStart(nx,0);rr.collapse(true);sel.removeAllRanges();sel.addRange(rr);queue();return
  }
  if(!P.auto||(mode!=='prose'&&mode!=='essay')||e.inputType!=='insertText'||!e.data||e.data.length!==1)return;
  let pre='';if(b){const rr=document.createRange();rr.setStart(b,0);rr.setEnd(r.startContainer,r.startOffset);pre=rr.toString()}
  const ch=e.data;let out=null,del=0;
  if(ch==='"')out=(!pre||/[\s(\[\u2014\u2013-]$/.test(pre))?'\u201C':'\u201D';
  else if(ch==="'")out=(!pre||/[\s(\[\u2014\u2013-]$/.test(pre))?'\u2018':'\u2019';
  else if(ch==='-'&&pre.endsWith('-')){out='\u2014';del=1}
  else if(ch==='.'&&pre.endsWith('..')){out='\u2026';del=2}
  else if(ch!==ch.toUpperCase()&&/\p{L}/u.test(ch)&&(pre===''||/^[\u201C\u2018("'\[]+$/.test(pre)||/[.!?]["\u201D')\]]*\s+$/.test(pre))&&!/\b(e\.g|i\.e|etc|vs|Mr|Mrs|Ms|Dr|Prof)\.\s+$/i.test(pre))out=ch.toUpperCase();
  if(out==null)return;
  e.preventDefault();for(let k=0;k<del;k++)document.execCommand('delete');document.execCommand('insertText',false,out);
});

/* ---------- Find and replace ---------- */
const fq=$('#fq'),fr=$('#fr');let lastFind=null;
function matches(){
  const q=fq.value;if(!q)return[];const ql=q.toLowerCase(),out=[],w=document.createTreeWalker(ed,NodeFilter.SHOW_TEXT);
  for(let n;(n=w.nextNode());){const t=n.nodeValue.toLowerCase();for(let i=t.indexOf(ql);i>=0;i=t.indexOf(ql,i+ql.length)){const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+q.length);out.push(r)}}
  return out
}
function pick(r,scroll){const s=getSelection();s.removeAllRanges();s.addRange(r);lastFind=r.cloneRange();ed.focus();if(scroll!==false)(r.startContainer.parentElement||ed).scrollIntoView({block:'center'})}
function fnd(){
  const ms=matches();if(!ms.length)return false;
  const s=getSelection();let from=(s.rangeCount&&ed.contains(s.anchorNode))?s.getRangeAt(0):lastFind;
  pick(ms.find(m=>from&&m.compareBoundaryPoints(Range.START_TO_START,from)>0)||ms[0]);return true
}
const putText=v=>{ed.focus();if(v)document.execCommand('insertText',false,v);else document.execCommand('delete')};
$('#findbar').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const f=b.dataset.f;
  if(f==='x'){$('#findbar').hidden=true;return}
  if(!fq.value)return;
  if(f==='next'){if(!fnd())st.textContent='Not found';return}
  if(f==='rep'){
    const s=getSelection(),on=s.rangeCount&&ed.contains(s.anchorNode)&&s.toString().toLowerCase()===fq.value.toLowerCase();
    if(!on){if(!fnd())st.textContent='Not found';return}
    putText(fr.value);queue();fnd();return
  }
  if(f==='all'){const ms=matches();for(let k=ms.length-1;k>=0;k--){pick(ms[k],false);putText(fr.value)}queue();st.textContent=ms.length+' replaced'}
});

/* ---------- Side sheets: contents, syllables, references, entries ---------- */
let sideKind=null;
function closeSide(){$('#side').hidden=true;sideKind=null}
$('#sideclose').onclick=closeSide;
$('#side').addEventListener('click',e=>{if(e.target.id==='side')closeSide()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSide()});
function openSide(k){sideKind=k;$('#side').hidden=false;renderSide()}
const jump=el=>{closeSide();el.scrollIntoView({block:'start',behavior:'smooth'})};
function sylEN(w){w=w.toLowerCase().replace(/[^a-z]/g,'');if(!w)return 0;if(w.length<=3)return 1;if(!/[td]ed$/.test(w))w=w.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/,'');w=w.replace(/^y/,'');const m=w.match(/[aeiouy]{1,2}/g);return m?m.length:1}
const sylSN=w=>(w.toLowerCase().match(/[aeiou]/g)||[]).length;
const sylOf=line=>(line.match(/[\p{L}']+/gu)||[]).reduce((a,w)=>a+(P.lang==='sn'?sylSN(w):sylEN(w)),0);
const sname=x=>x.split(',')[0].trim();
function auth(a){const p=a.split(';').map(x=>x.trim()).filter(Boolean);if(p.length<2)return p[0]||'';return P.cs==='apa'?p.slice(0,-1).join(', ')+', & '+p[p.length-1]:p.slice(0,-1).join(', ')+' and '+p[p.length-1]}
function citeOf(r){const p=r.a.split(';').map(x=>x.trim()).filter(Boolean);const n=p.length>2?sname(p[0])+' et al.':p.length===2?sname(p[0])+(P.cs==='apa'?' & ':' and ')+sname(p[1]):sname(p[0]||'Anon');return '('+n+(P.cs==='apa'?', ':' ')+(r.y||'n.d.')+')'}
function refHtml(r){
  const A=esc(auth(r.a)||'Anon'),y=esc(r.y||'n.d.'),T=esc(r.t),S=esc(r.s||''),I=x=>'<i>'+x+'</i>',U=esc(r.u||''),
    head=P.cs==='apa'?A+' ('+y+'). ':A+' '+y+'. ';
  if(r.k==='article')return head+(P.cs==='apa'?T+'. ':'\u2018'+T+'\u2019, ')+I(S)+(r.d?', '+esc(r.d):'')+'.';
  if(r.k==='web')return head+I(T)+'. '+(S?S+'. ':'')+(P.cs==='apa'?U:'Available at: '+U+' (Accessed: '+new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})+').');
  return head+I(T)+'. '+S+'.';
}
function renderSide(){
  const body=$('#sidebody');
  const T={toc:'Contents',syl:'Syllables',refs:'References',entries:'Journal entries'}[sideKind];
  $('#sidetitle').textContent=T;
  if(sideKind==='toc'){
    const hs=[...ed.querySelectorAll('h1,h2,h3,h4')];
    body.innerHTML=hs.length?hs.map((x,i)=>'<button class="tocr l'+x.tagName[1]+'" data-i="'+i+'">'+esc(x.textContent||'(empty heading)')+'</button>').join(''):'<div class="note">No headings yet. Use Styles to add Heading 1 to 4 and they will appear here.</div>';
    body.onclick=e=>{const b=e.target.closest('.tocr');if(b)jump(hs[+b.dataset.i])};
  }else if(sideKind==='entries'){
    const js=[...ed.querySelectorAll('.jd')];
    body.innerHTML=js.length?js.map((x,i)=>'<button class="tocr" data-i="'+i+'">'+esc(x.textContent)+'</button>').join(''):'<div class="note">No entries yet. Tap Today to add one.</div>';
    body.onclick=e=>{const b=e.target.closest('.tocr');if(b)jump(js[+b.dataset.i])};
  }else if(sideKind==='syl'){
    const G=[{n:'',l:[]}];
    [...ed.childNodes].forEach(k=>{const tx=(k.textContent||'').replace(/\u00a0/g,' ').trim();if(!tx)return;if(k.classList&&k.classList.contains('sec'))G.push({n:tx,l:[]});else G[G.length-1].l.push(tx)});
    let html='<div class="seg"><button data-lang="en" class="'+(P.lang==='en'?'on':'')+'">English</button><button data-lang="sn" class="'+(P.lang==='sn'?'on':'')+'">Shona / Chewa</button></div>';
    const any=G.some(g=>g.l.length);
    G.forEach(g=>{if(!g.l.length&&!g.n)return;if(g.n)html+='<div class="sh">'+esc(g.n)+' \u00b7 '+g.l.length+(g.l.length===1?' line':' lines')+'</div>';g.l.forEach(l=>{html+='<div class="sl"><b>'+sylOf(l)+'</b><span>'+esc(l)+'</span></div>'})});
    if(!any)html+='<div class="note">Write a few lines and their syllable counts will show here.</div>';
    body.innerHTML=html+'<div class="note">Counts are estimates. English uses common spelling rules; Shona and Chewa count vowels.</div>';
    body.onclick=e=>{const b=e.target.closest('[data-lang]');if(b){P.lang=b.dataset.lang;apply();renderSide()}};
  }else if(sideKind==='refs'){
    const rows=refs.map((r,i)=>'<div class="rr"><span>'+esc(citeOf(r))+' \u2013 '+esc(r.t)+'</span><button data-cite="'+i+'">Cite</button><button data-del="'+i+'" aria-label="Remove">&times;</button></div>').join('');
    body.innerHTML='<div class="seg"><button data-cs="apa" class="'+(P.cs==='apa'?'on':'')+'">APA 7</button><button data-cs="harvard" class="'+(P.cs==='harvard'?'on':'')+'">Harvard</button></div>'+
      '<div class="rf"><select id="rt"><option value="book">Book</option><option value="article">Journal article</option><option value="web">Website</option></select><input id="ra" placeholder="Author(s): Surname, I.; Surname, I."><input id="ry" placeholder="Year"><input id="rtl" placeholder="Title"><input id="rs" placeholder="Publisher, journal or website name"><input id="rd" placeholder="Volume(issue), pages (articles)"><input id="ru" placeholder="Link (websites)"><button id="radd" class="rb">Add source</button></div>'+
      '<div class="sh">Your sources</div>'+(rows||'<div class="note">No sources yet.</div>')+(refs.length?'<button id="rins" class="rb ghost">Insert reference list at cursor</button>':'');
    body.onclick=e=>{
      const t=e.target;
      if(t.dataset.cs){P.cs=t.dataset.cs;apply();renderSide();return}
      if(t.id==='radd'){const g=id=>$('#'+id).value.trim(),r={k:g('rt'),a:g('ra'),y:g('ry'),t:g('rtl'),s:g('rs'),d:g('rd'),u:g('ru')};if(!r.t||!r.a){st.textContent='Add an author and a title';return}refs.push(r);queue();renderSide();return}
      if(t.dataset.del){refs.splice(+t.dataset.del,1);queue();renderSide();return}
      if(t.dataset.cite){const c=citeOf(refs[+t.dataset.cite]);closeSide();restoreSel();document.execCommand('insertText',false,c);queue();return}
      if(t.id==='rins'){const list=[...refs].sort((x,y)=>(auth(x.a)).localeCompare(auth(y.a)));closeSide();restoreSel();
        document.execCommand('insertHTML',false,'<h2>References</h2>'+list.map(r=>'<div class="ref">'+refHtml(r)+'</div>').join('')+'<div><br></div>');queue()}
    };
  }
}
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    reg.update().catch(()=>{});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(!had)return;
    const a=document.activeElement;
    if(a!==ed&&a!==title){save();location.reload()}
  });
}
